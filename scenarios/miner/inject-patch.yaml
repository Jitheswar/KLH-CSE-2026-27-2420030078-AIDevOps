# Strategic merge patch: adds the Scenario as a second container on the
# internet-facing nginx Workload's pod template. Applied by `make
# scenario-miner-start`; never referenced by anything under src/.
# The image tag below is a placeholder rewritten by the Makefile to
# SCENARIO_MINER_IMAGE before this file is fed to `kubectl patch`, so the
# two stay in sync.
spec:
  template:
    spec:
      containers:
        - name: miner-scenario
          image: aidevops-miner-scenario:latest
          imagePullPolicy: Never
          resources:
            limits:
              cpu: "500m"
              memory: "64Mi"
