# kind cluster used for local development.
#
# The control-plane node is labelled ingress-ready=true and its 80/443 are
# mapped out to the host, which is what the stock ingress-nginx "kind"
# provider manifest (applied by `make cluster-up`) expects to bind to.
# Prometheus's NodePort (deploy/prometheus/04-service.yaml) is mapped out
# the same way, so the platform can reach it from the host with `make run`;
# the in-cluster deployment (deploy/platform/) instead reaches Prometheus
# through cluster DNS and does not need this mapping.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aidevops
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
