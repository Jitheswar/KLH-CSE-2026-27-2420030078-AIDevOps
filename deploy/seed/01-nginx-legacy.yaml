# Profile: externally reachable, old, large CVE count.
# nginx 1.14.2 (2018) behind both a NodePort Service and an Ingress - the
# spec's "old nginx behind NodePort and Ingress" seed Workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-legacy
  namespace: web
  labels:
    app: nginx-legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-legacy
  template:
    metadata:
      labels:
        app: nginx-legacy
    spec:
      containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-legacy
  namespace: web
spec:
  type: NodePort
  selector:
    app: nginx-legacy
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-legacy
  namespace: web
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-legacy
                port:
                  number: 80
