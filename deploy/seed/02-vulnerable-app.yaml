# Profile: internal, heavily vulnerable application.
# OWASP Juice Shop is a deliberately vulnerable Node.js app, pinned to an old
# release for a large, real CVE count in its dependency tree. ClusterIP only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: apps
  labels:
    app: vulnerable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop:v14.0.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-app
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: vulnerable-app
  ports:
    - port: 3000
      targetPort: 3000
