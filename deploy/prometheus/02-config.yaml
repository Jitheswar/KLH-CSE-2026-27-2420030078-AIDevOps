# Plain Prometheus scraping the kubelet's cAdvisor endpoint on every node,
# at the 15 second resolution the spec asks for. No node-exporter, no
# kube-state-metrics, no Alertmanager, no Grafana - the platform's interface
# is the deliverable, so this stays the platform's only telemetry source
# rather than growing into an observability stack of its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
