# NodePort, not ClusterIP: `make run` runs the platform on the host, so it
# reaches Prometheus through the kind node's port mapping in
# deploy/kind/kind-config.yaml rather than through in-cluster DNS. The
# in-cluster deployment (deploy/platform/) uses this Service's ClusterIP
# DNS name directly and ignores the NodePort.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
